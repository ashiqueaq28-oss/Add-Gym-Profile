<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FITAVAL — List Your Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --black:#0E0F11; --ink:#1A1C1F; --white:#FFFFFF; --paper:#FAFAF9; --light-gray:#F0F1EF;
    --line:#E6E7E5; --line-strong:#D6D8D5; --gray:#6B7075; --gray-light:#9CA0A4;
    --green:#0E7C4A; --green-dark:#0A5E38; --green-tint:#EAF6EF; --danger:#C0392B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--black); font-family:'Inter',sans-serif; min-height:100vh;}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:26px 40px; border-bottom:1px solid var(--line); background:var(--white);}
  .wordmark{font-weight:800; font-size:17px;}
  .wordmark span{color:var(--green);}
  .topbar-note{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--gray);}

  .stage{min-height:calc(100vh - 76px); display:flex; align-items:center; justify-content:center; padding:60px 24px;}
  .wrap{max-width:900px; margin:0 auto; padding:48px 24px 100px;}

  /* progress ledger */
  .progress-head{margin-bottom:34px;}
  .progress-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .progress-label{font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.05em; color:var(--gray);}
  .progress-label b{color:var(--black); font-weight:700;}
  .progress-phase{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--green-dark); background:var(--green-tint); padding:5px 11px; border-radius:99px; border:1px solid rgba(14,124,74,0.18);}
  .ledger-track{display:flex; gap:5px;}
  .tick{flex:1; height:4px; border-radius:3px; background:var(--line);}
  .tick.filled{background:var(--green);}

  h1{font-size:28px; font-weight:800; letter-spacing:-0.01em; margin:28px 0 8px;}
  .lede{font-size:15px; line-height:1.6; color:var(--gray); margin:0 0 34px; max-width:56ch;}

  /* landing screen */
  .landing{width:100%; max-width:560px; text-align:center;}
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px; font-family:'JetBrains Mono',monospace; font-size:11px;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--green-dark); background:var(--green-tint);
    border:1px solid rgba(14,124,74,0.18); padding:7px 14px; border-radius:99px; margin-bottom:26px;
  }
  .eyebrow::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--green);}
  .landing h1{font-size:38px; line-height:1.15; margin:0 0 16px;}
  .landing .lede{font-size:16px; max-width:44ch; margin:0 auto 40px;}
  .ledger.center{margin:0 auto 8px; max-width:340px;}
  .ledger-label{font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.04em; color:var(--gray); margin-bottom:36px;}
  .ledger-label b{color:var(--black); font-weight:600;}
  .cta{
    appearance:none; border:none; background:var(--green); color:var(--white); font-family:'Inter',sans-serif;
    font-weight:700; font-size:15.5px; padding:16px 34px; border-radius:10px; cursor:pointer; letter-spacing:0.01em;
    transition:background .15s ease, transform .1s ease;
  }
  .cta:hover{background:var(--green-dark);} .cta:active{transform:translateY(1px);}
  .cta-sub{margin-top:14px; font-size:13px; color:var(--gray);}
  .reassure{margin-top:48px; padding-top:28px; border-top:1px solid var(--line); display:flex; justify-content:center; gap:28px; flex-wrap:wrap;}
  .reassure-item{font-size:12.5px; color:var(--gray); display:flex; align-items:center; gap:7px;}
  .reassure-item .dot{width:5px; height:5px; border-radius:50%; background:var(--black); flex:none;}

  /* generic section blocks */
  section.block{background:var(--white); border:1px solid var(--line-strong); border-radius:14px; padding:24px 26px; margin-bottom:18px;}
  .block-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--line); flex-wrap:wrap; gap:10px;}
  .block-head-left{display:flex; align-items:baseline; gap:10px;}
  .block-eyebrow{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--green-dark);}
  .block-title{font-size:15px; font-weight:800;}
  .block-subheading{font-size:19px; font-weight:800; margin:0 0 20px;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .grid4{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:16px;}
  @media (max-width:640px){.grid2,.grid4{grid-template-columns:1fr;}}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink); margin-bottom:7px;}
  .field label .req{color:var(--green-dark);}
  .field input, .field select, .field textarea{
    width:100%; background:var(--white); border:1px solid var(--line-strong); color:var(--black);
    border-radius:9px; padding:11px 13px; font-size:14px; font-family:'Inter',sans-serif; outline:none;
    transition:border-color .15s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--green);}
  .field textarea{min-height:100px; resize:vertical;}
  .invalid{border-color:var(--danger) !important;}

  /* upload cards (logo/banner) */
  .upload-row{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:6px;}
  @media (max-width:560px){.upload-row{grid-template-columns:1fr;}}
  .upload-card{border:1px solid var(--line-strong); border-radius:12px; background:var(--white); padding:16px;}
  .upload-card-label{font-size:13px; font-weight:700; margin-bottom:4px;}
  .upload-card-label .req{color:var(--green-dark);}
  .upload-card-hint{font-size:11.5px; color:var(--gray-light); margin-bottom:12px;}
  .dropzone{
    border:1.5px dashed var(--line-strong); border-radius:10px; padding:24px 14px; text-align:center;
    cursor:pointer; transition:all .15s ease; color:var(--gray); font-size:13px;
  }
  .dropzone:hover, .dropzone.drag{border-color:var(--green); color:var(--green-dark); background:var(--green-tint);}
  .dropzone .browse{color:var(--green-dark); font-weight:700; text-decoration:underline;}
  .logo-preview-wrap{display:flex; align-items:center; gap:14px;}
  .logo-thumb{width:76px; height:76px; border-radius:10px; object-fit:cover; border:1px solid var(--line); flex:none;}
  .banner-thumb{width:100%; height:110px; border-radius:10px; object-fit:cover; border:1px solid var(--line); margin-bottom:10px;}
  .preview-actions{display:flex; gap:16px;}
  .text-btn{background:none; border:none; font-size:12.5px; font-weight:700; cursor:pointer; padding:0;}
  .text-btn.change{color:var(--green-dark);} .text-btn.remove{color:var(--danger);}

  /* location / map */
  .map-search-row{display:flex; gap:10px; margin-bottom:14px; position:relative;}
  .map-search-row input{flex:1; background:var(--white); border:1px solid var(--line-strong); border-radius:9px; padding:12px 13px; font-size:14px; outline:none;}
  .map-search-row input:focus{border-color:var(--green);}
  .map-btn{background:var(--white); border:1px solid var(--line-strong); border-radius:9px; padding:11px 15px; font-size:13px; font-weight:600; color:var(--ink); cursor:pointer; white-space:nowrap; transition:all .15s ease;}
  .map-btn:hover{border-color:var(--green); color:var(--green-dark);}
  .suggest-list{position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--white); border:1px solid var(--line-strong); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,0.08); z-index:1000; max-height:220px; overflow-y:auto; display:none;}
  .suggest-list.show{display:block;}
  .suggest-item{padding:10px 13px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--line);}
  .suggest-item:last-child{border-bottom:none;} .suggest-item:hover{background:var(--green-tint);}
  #mapEl{width:100%; height:320px; border-radius:12px; border:1px solid var(--line-strong); margin-bottom:14px; background:var(--line);}
  .map-actions{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  .location-caption{font-size:12.5px; color:var(--gray);}
  .location-caption b{color:var(--black);}
  .confirm-btn{background:var(--green); color:var(--white); border:none; border-radius:9px; padding:11px 18px; font-size:13.5px; font-weight:700; cursor:pointer;}
  .confirm-btn:hover{background:var(--green-dark);}
  .confirmed-tag{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--green-dark); background:var(--green-tint); border:1px solid rgba(14,124,74,0.18); padding:5px 11px; border-radius:99px;}

  /* hours */
  .apply-row{display:flex; justify-content:flex-end; margin-bottom:14px;}
  .day-card{display:grid; grid-template-columns:120px auto 1fr 1fr; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--line);}
  .day-card:last-child{border-bottom:none;}
  @media (max-width:640px){.day-card{grid-template-columns:1fr 1fr; row-gap:10px;} .day-card .day-name{grid-column:1/2;} .day-card .toggle-wrap{grid-column:2/3; justify-self:end;}}
  .day-name{font-size:14px; font-weight:700;}
  .toggle-wrap{display:flex; align-items:center; gap:8px;}
  .switch{position:relative; width:40px; height:22px; flex:none;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{position:absolute; inset:0; background:var(--line-strong); border-radius:99px; cursor:pointer; transition:.15s;}
  .slider::before{content:''; position:absolute; width:16px; height:16px; left:3px; top:3px; background:var(--white); border-radius:50%; transition:.15s;}
  .switch input:checked + .slider{background:var(--green);}
  .switch input:checked + .slider::before{transform:translateX(18px);}
  .toggle-status{font-size:12.5px; font-weight:600; color:var(--gray); min-width:44px;}
  .day-card input[type=time]{background:var(--white); border:1px solid var(--line-strong); border-radius:8px; padding:9px 10px; font-size:13.5px; width:100%;}
  .day-card.closed input[type=time]{opacity:0.4; pointer-events:none; background:var(--paper);}
  .day-card.closed .day-name{color:var(--gray-light);}
  .holiday-card{background:var(--white); border:1px solid var(--line-strong); border-radius:11px; padding:16px; margin-bottom:12px; position:relative;}
  .holiday-card .remove{position:absolute; top:10px; right:10px; background:none; border:none; color:var(--gray-light); font-size:16px; cursor:pointer;}
  .holiday-card .remove:hover{color:var(--danger);}
  .holiday-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:12px;}
  @media (max-width:640px){.holiday-grid{grid-template-columns:1fr;}}
  .holiday-grid .field{margin-bottom:0;}
  .empty-holidays{font-size:13px; color:var(--gray-light); margin-bottom:14px;}

  /* services/amenities cards */
  .card-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:12px; margin-bottom:16px;}
  .card{position:relative; background:var(--white); border:1.5px solid var(--line-strong); border-radius:12px; padding:18px 14px; display:flex; flex-direction:column; align-items:flex-start; gap:12px; cursor:pointer; transition:all .15s ease; user-select:none;}
  .card:hover{border-color:var(--gray-light);}
  .card.on{border-color:var(--green); background:var(--green-tint);}
  .card-icon{width:34px; height:34px; display:flex; align-items:center; justify-content:center; color:var(--ink); transition:color .15s ease;}
  .card.on .card-icon{color:var(--green-dark);}
  .card-icon svg{width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
  .card-name{font-size:13.5px; font-weight:600; color:var(--black); line-height:1.3;}
  .card-check{position:absolute; top:12px; right:12px; width:18px; height:18px; border-radius:5px; border:1.5px solid var(--line-strong); background:var(--white); display:flex; align-items:center; justify-content:center; transition:all .15s ease;}
  .card.on .card-check{background:var(--green); border-color:var(--green);}
  .card-check svg{width:11px; height:11px; stroke:var(--white); fill:none; stroke-width:3; opacity:0;}
  .card.on .card-check svg{opacity:1;}
  .card.custom{border-style:dashed;}
  .card .remove-custom{position:absolute; bottom:10px; right:12px; font-size:11px; color:var(--gray-light); background:none; border:none; cursor:pointer; font-weight:600;}
  .card .remove-custom:hover{color:var(--danger);}
  .selected-count{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--green-dark); background:var(--green-tint); padding:5px 11px; border-radius:99px; border:1px solid rgba(14,124,74,0.18); font-weight:600;}
  .custom-input-row{display:flex; gap:10px; margin-bottom:16px;}
  .custom-input-row input{flex:1; background:var(--white); border:1px solid var(--line-strong); border-radius:9px; padding:11px 13px; font-size:14px; outline:none;}
  .custom-input-row input:focus{border-color:var(--green);}
  .custom-input-row button{background:var(--green); color:var(--white); border:none; border-radius:9px; padding:0 18px; font-size:13.5px; font-weight:700; cursor:pointer;}
  .custom-input-row button:hover{background:var(--green-dark);}
  .custom-input-row .cancel{background:none; color:var(--gray); border:1px solid var(--line-strong);}
  .custom-input-row .cancel:hover{color:var(--black); background:none;}

  /* generic add button */
  .add-btn{background:none; border:1px dashed var(--line-strong); color:var(--gray); padding:12px; width:100%; border-radius:10px; cursor:pointer; font-size:13.5px; font-weight:700; transition:all .15s ease;}
  .add-btn:hover{border-color:var(--green); color:var(--green-dark);}

  /* plans */
  .plans-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:14px; margin-bottom:18px;}
  .plan-card{background:var(--white); border:1.5px solid var(--line-strong); border-radius:14px; padding:20px; display:flex; flex-direction:column; position:relative;}
  .plan-card-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}
  .plan-name{font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--green-dark);}
  .plan-reorder{display:flex; flex-direction:column; gap:2px;}
  .reorder-btn{background:none; border:none; color:var(--gray-light); cursor:pointer; width:20px; height:16px; display:flex; align-items:center; justify-content:center; padding:0;}
  .reorder-btn:hover{color:var(--black);} .reorder-btn:disabled{opacity:0.25; cursor:not-allowed;}
  .reorder-btn svg{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2.4;}
  .plan-price{font-size:26px; font-weight:800; letter-spacing:-0.01em; margin-bottom:2px;}
  .plan-duration{font-size:12.5px; color:var(--gray); margin-bottom:16px;}
  .plan-features{list-style:none; margin:0 0 18px; padding:0; flex:1;}
  .plan-features li{font-size:13px; color:var(--ink); padding:6px 0 6px 20px; position:relative; border-top:1px solid var(--line);}
  .plan-features li:first-child{border-top:none;}
  .plan-features li::before{content:''; position:absolute; left:0; top:12px; width:8px; height:8px; border-radius:50%; background:var(--green-tint); border:1.5px solid var(--green);}
  .plan-features-empty{font-size:12.5px; color:var(--gray-light); font-style:italic; margin-bottom:18px;}
  .plan-actions{display:flex; gap:14px; padding-top:14px; border-top:1px solid var(--line);}
  .plan-actions button{background:none; border:none; font-size:12.5px; font-weight:700; cursor:pointer; padding:0;}
  .plan-actions .edit-btn{color:var(--green-dark);} .plan-actions .delete-btn{color:var(--danger);}
  .empty-plans{border:1.5px dashed var(--line-strong); border-radius:14px; padding:40px 20px; text-align:center; color:var(--gray-light); font-size:13.5px; margin-bottom:18px;}
  .form-panel{display:none; background:var(--white); border:1.5px solid var(--line-strong); border-radius:14px; padding:26px; margin-top:20px;}
  .form-panel.open{display:block;}
  .form-panel-title{font-size:16px; font-weight:800; margin:0 0 20px;}
  .feature-row{display:flex; gap:8px; margin-bottom:9px;}
  .feature-row input{flex:1; background:var(--paper); border:1px solid var(--line-strong); border-radius:9px; padding:10px 12px; font-size:13.5px; outline:none;}
  .feature-row button{background:none; border:1px solid var(--line-strong); color:var(--gray); border-radius:8px; width:36px; cursor:pointer; font-size:14px;}
  .feature-row button:hover{color:var(--danger); border-color:var(--danger);}
  .add-feature-btn{background:none; border:1px dashed var(--line-strong); color:var(--gray); padding:9px; width:100%; border-radius:9px; cursor:pointer; font-size:12.5px; font-weight:700; transition:all .15s ease; margin-bottom:20px;}
  .add-feature-btn:hover{border-color:var(--green); color:var(--green-dark);}
  .form-actions{display:flex; justify-content:flex-end; gap:10px; padding-top:16px; border-top:1px solid var(--line);}

  /* gallery */
  .gallery-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:14px; margin:20px 0 10px;}
  .photo-card{background:var(--white); border:1.5px solid var(--line-strong); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; position:relative;}
  .photo-card.is-cover{border-color:var(--green);}
  .photo-media{position:relative; width:100%; aspect-ratio:4/3; background:var(--line); overflow:hidden;}
  .photo-media img{width:100%; height:100%; object-fit:cover; display:block;}
  .cover-badge{position:absolute; top:10px; left:10px; background:var(--green); color:var(--white); font-size:10.5px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; padding:5px 10px; border-radius:99px; display:flex; align-items:center; gap:5px;}
  .cover-badge svg{width:10px; height:10px; stroke:var(--white); fill:none; stroke-width:3;}
  .reorder-overlay{position:absolute; top:8px; right:8px; display:flex; flex-direction:column; gap:3px;}
  .gal-reorder-btn{width:24px; height:20px; background:rgba(14,15,17,0.55); border:none; border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .gal-reorder-btn svg{width:12px; height:12px; stroke:var(--white); fill:none; stroke-width:2.6;}
  .gal-reorder-btn:hover{background:rgba(14,15,17,0.8);}
  .gal-reorder-btn:disabled{opacity:0.3; cursor:not-allowed;}
  .delete-overlay{position:absolute; bottom:8px; right:8px; width:26px; height:26px; background:rgba(14,15,17,0.55); border:none; border-radius:7px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .delete-overlay svg{width:13px; height:13px; stroke:var(--white); fill:none; stroke-width:2.2;}
  .delete-overlay:hover{background:var(--danger);}
  .photo-meta{padding:12px 14px 14px;}
  .photo-meta select{width:100%; background:var(--paper); border:1px solid var(--line-strong); color:var(--black); border-radius:8px; padding:8px 10px; font-size:12.5px; font-family:'Inter',sans-serif; outline:none; margin-bottom:10px;}
  .set-cover-btn{width:100%; background:none; border:1px solid var(--line-strong); color:var(--ink); border-radius:8px; padding:8px; font-size:12px; font-weight:700; cursor:pointer; transition:all .15s ease;}
  .set-cover-btn:hover{border-color:var(--green); color:var(--green-dark);}
  .set-cover-btn.active{background:var(--green-tint); border-color:var(--green); color:var(--green-dark); cursor:default;}
  .empty-state{text-align:center; padding:30px 20px; color:var(--gray-light); font-size:13.5px; margin-bottom:14px;}

  /* review */
  .head-row{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin:28px 0 34px; flex-wrap:wrap;}
  .completion{text-align:right; flex:none;}
  .completion-ring{width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-left:auto;}
  .completion-ring-inner{width:44px; height:44px; background:var(--white); border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:700; color:var(--green-dark);}
  .completion-label{font-size:11px; color:var(--gray); margin-top:6px; font-weight:600;}
  .kv-list{display:flex; flex-direction:column;}
  .kv-row{display:flex; gap:14px; font-size:13.5px; padding:8px 0; border-top:1px solid var(--line);}
  .kv-row:first-child{border-top:none;}
  .kv-k{min-width:150px; flex:none; color:var(--gray); font-weight:600;}
  .kv-v{color:var(--black); line-height:1.5;}
  .contact-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 20px;}
  @media (max-width:560px){.contact-grid{grid-template-columns:1fr;}}
  .brand-preview{display:flex; gap:20px; margin-bottom:20px; flex-wrap:wrap;}
  .map-embed{width:100%; height:180px; border-radius:10px; border:1px solid var(--line-strong); margin-top:14px; overflow:hidden;}
  .map-embed iframe{width:100%; height:100%; border:0;}
  .hours-row{display:flex; justify-content:space-between; font-size:13.5px; padding:7px 0; border-top:1px solid var(--line);}
  .hours-row:first-child{border-top:none;}
  .hours-row .day{font-weight:600;} .hours-row .time{color:var(--gray);}

</head>

    if(!b.logo) missing.push('logo-check');
    if(missing.length){
      required.forEach(id=>{
        const f = document.getElementById(id);
        if(!f.value.trim()){ f.classList.add('invalid'); f.addEventListener('input', ()=> f.classList.remove('invalid'), {once:true}); }
      });
      if(!b.logo) document.getElementById('logoZoneWrap').scrollIntoView({behavior:'smooth', block:'center'});
      else document.getElementById(missing[0]).scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
    goto(3);
  });

function wireUpload({ zoneWrapId, inputId, stateKey, square }){
  const wrap = document.getElementById(zoneWrapId);
  const input = document.getElementById(inputId);
  const b = state.basicInfo;

  function renderEmpty(){
    wrap.innerHTML = `<div class="dropzone" id="${zoneWrapId}_zone">Drag & drop, or <span class="browse">browse ${square ? 'files' : ''}</span></div>`;
    bindZone();
  }
  function renderPreview(src){
    if(square){
      wrap.innerHTML = `<div class="logo-preview-wrap"><img class="logo-thumb" src="${src}"><div class="preview-actions"><button class="text-btn change" id="${zoneWrapId}_change">Change</button><button class="text-btn remove" id="${zoneWrapId}_remove">Remove</button></div></div>`;
    } else {
      wrap.innerHTML = `<img class="banner-thumb" src="${src}"><div class="preview-actions"><button class="text-btn change" id="${zoneWrapId}_change">Replace</button><button class="text-btn remove" id="${zoneWrapId}_remove">Remove</button></div>`;
    }
    document.getElementById(`${zoneWrapId}_change`).addEventListener('click', ()=> input.click());
    document.getElementById(`${zoneWrapId}_remove`).addEventListener('click', ()=>{ b[stateKey] = null; renderEmpty(); });
  }
  function bindZone(){
    const zone = document.getElementById(`${zoneWrapId}_zone`);
    zone.addEventListener('click', ()=> input.click());
    zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('drag'); });
    zone.addEventListener('dragleave', ()=> zone.classList.remove('drag'));
    zone.addEventListener('drop', e=>{ e.preventDefault(); zone.classList.remove('drag'); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
  }
  function handleFile(file){
    const reader = new FileReader();
    reader.onload = ev => {
      b[stateKey] = {
        base64: ev.target.result,
        name: file.name,
        type: file.type || 'image/png'
      };
      renderPreview(ev.target.result);
    };
    reader.readAsDataURL(file);
  }
  input.addEventListener('change', e => { if(e.target.files[0]) handleFile(e.target.files[0]); });

  if(b[stateKey]) renderPreview(typeof b[stateKey] === 'object' ? b[stateKey].base64 : b[stateKey]); else renderEmpty();
}

  ['address','city','state','pincode','country'].forEach(id=>{
    document.getElementById(id).addEventListener('input', e=>{ l[id] = e.target.value; });
  });

  // ---- map ----
  if(mapInstance){ mapInstance.remove(); mapInstance = null; }
  mapInstance = L.map('mapEl', { scrollWheelZoom:false }).setView([l.lat, l.lng], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'&copy; OpenStreetMap contributors', maxZoom:19 }).addTo(mapInstance);
  mapMarker = L.marker([l.lat, l.lng], { draggable:true }).addTo(mapInstance);

  function setLocation(lat, lng, label){
    l.lat = lat; l.lng = lng; l.confirmed = false;
    mapMarker.setLatLng([lat,lng]);
    mapInstance.setView([lat,lng], 15);
    document.getElementById('locationCaption').innerHTML = `${label ? '<b>'+label+'</b>' : `Pin at <b>${lat.toFixed(5)}, ${lng.toFixed(5)}</b>`} — not yet confirmed.`;
  }

  mapMarker.on('dragend', ()=>{ const pos = mapMarker.getLatLng(); setLocation(pos.lat, pos.lng); reverseGeocode(pos.lat, pos.lng); });
  mapInstance.on('click', e => { setLocation(e.latlng.lat, e.latlng.lng); reverseGeocode(e.latlng.lat, e.latlng.lng); });

  let searchTimer;
  const searchInput = document.getElementById('mapSearch');
  const suggestList = document.getElementById('suggestList');
  searchInput.addEventListener('input', ()=>{
    clearTimeout(searchTimer);
    const q = searchInput.value.trim();
    if(q.length < 3){ suggestList.classList.remove('show'); return; }
    searchTimer = setTimeout(async ()=>{
      try{
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(q)}`);
        const results = await res.json();
        if(!results.length){ suggestList.classList.remove('show'); return; }
        suggestList.innerHTML = results.map((r,i)=>`<div class="suggest-item" data-i="${i}">${r.display_name}</div>`).join('');
        suggestList.classList.add('show');
        suggestList.querySelectorAll('.suggest-item').forEach(item=>{
          item.addEventListener('click', ()=>{
            const r = results[item.dataset.i];
            setLocation(parseFloat(r.lat), parseFloat(r.lon), r.display_name.split(',')[0]);
            searchInput.value = r.display_name;
            suggestList.classList.remove('show');
            fillAddressFromResult(r);
          });
        });
      }catch(err){ /* offline/blocked — no-op */ }
    }, 400);
  });
  document.addEventListener('click', e=>{ if(!suggestList.contains(e.target) && e.target !== searchInput) suggestList.classList.remove('show'); });

  document.getElementById('currentLocBtn').addEventListener('click', ()=>{
    if(!navigator.geolocation){ alert('Geolocation is not available in this browser.'); return; }
    navigator.geolocation.getCurrentPosition(
      pos => { setLocation(pos.coords.latitude, pos.coords.longitude, 'Current location'); reverseGeocode(pos.coords.latitude, pos.coords.longitude); },
      () => alert('Could not access your location. You can search or drop the pin manually instead.')
    );
  });

  async function reverseGeocode(lat, lng){
    try{
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
      const r = await res.json();
      fillAddressFromResult(r);
    }catch(err){ /* offline/blocked */ }
  }
  function fillAddressFromResult(r){
    const a = r.address || {};
    if(!document.getElementById('city').value) document.getElementById('city').value = a.city || a.town || a.village || '';
    if(!document.getElementById('state').value) document.getElementById('state').value = a.state || '';
    if(!document.getElementById('pincode').value) document.getElementById('pincode').value = a.postcode || '';
    if(!document.getElementById('country').value) document.getElementById('country').value = a.country || '';
    ['city','state','pincode','country'].forEach(id=>{ l[id] = document.getElementById(id).value; });
  }

  document.getElementById('confirmLocBtn').addEventListener('click', ()=>{
    l.confirmed = true;
    document.getElementById('locationCaption').innerHTML = `<span class="confirmed-tag">✓ Confirmed</span> Your gym location is set at <b>${l.lat.toFixed(5)}, ${l.lng.toFixed(5)}</b>.`;
  });

  // ---- hours ----
  const hoursList = document.getElementById('hoursList');

  function renderHours(){
    hoursList.innerHTML = DAYS.map(day=>{

        <div class="day-name">${day}</div>
        <div class="toggle-wrap"><label class="switch"><input type="checkbox" data-day="${day}" data-field="open" ${d.open?'checked':''}><span class="slider"></span></label><span class="toggle-status">${d.open?'Open':'Closed'}</span></div>
        <input type="time" data-day="${day}" data-field="start" value="${d.start}" ${d.open?'':'disabled'}>
        <input type="time" data-day="${day}" data-field="end" value="${d.end}" ${d.open?'':'disabled'}>
      </div>`;
    }).join('');
    hoursList.querySelectorAll('[data-field="open"]').forEach(cb => cb.addEventListener('change', e => { state.hours[e.target.dataset.day].open = e.target.checked; renderHours(); }));
    hoursList.querySelectorAll('[data-field="start"],[data-field="end"]').forEach(inp => inp.addEventListener('input', e => { state.hours[e.target.dataset.day][e.target.dataset.field] = e.target.value; }));
  }
  renderHours();
  document.getElementById('applyMondayBtn').addEventListener('click', ()=>{
    const mon = state.hours.Monday;
    ['Tuesday','Wednesday','Thursday','Friday'].forEach(d => state.hours[d] = {...mon});
    renderHours();
  });

  // ---- holidays ----
  const holidayList = document.getElementById('holidayList');
  const emptyHolidays = document.getElementById('emptyHolidays');
  function renderHolidays(){
    emptyHolidays.style.display = state.holidays.length ? 'none' : 'block';
    holidayList.innerHTML = state.holidays.map((h,i)=>`
      <div class="holiday-card">
        <button class="remove" data-remove="${i}">✕</button>

          <div class="field"><label>Status</label><select data-i="${i}" data-field="status">
            <option value="Closed" ${h.status==='Closed'?'selected':''}>Closed</option>
            <option value="Special hours" ${h.status==='Special hours'?'selected':''}>Special hours</option>
          </select></div>
        </div>
      </div>`).join('');
    holidayList.querySelectorAll('[data-field]').forEach(inp => inp.addEventListener('input', e => { state.holidays[e.target.dataset.i][e.target.dataset.field] = e.target.value; }));
    holidayList.querySelectorAll('[data-remove]').forEach(btn => btn.addEventListener('click', ()=>{ state.holidays.splice(btn.dataset.remove,1); renderHolidays(); }));
  }
  document.getElementById('addHolidayBtn').addEventListener('click', ()=>{ state.holidays.push({name:"",date:"",status:"Closed"}); renderHolidays(); });
  renderHolidays();

  document.getElementById('backBtn').addEventListener('click', ()=> goto(2));
  document.getElementById('continueBtn').addEventListener('click', ()=>{
    const required = ['address','city','state','pincode','country'];
    const missing = required.filter(id => !document.getElementById(id).value.trim());
    if(missing.length){
      missing.forEach(id=>{
        const f = document.getElementById(id);

      });
      document.getElementById(missing[0]).scrollIntoView({behavior:'smooth', block:'center'});

    }
    if(!l.confirmed){

      titleEl.textContent = "New Membership Plan";
      document.getElementById('planName').value=''; document.getElementById('planPrice').value='';
      planDuration.value=''; customDurationField.style.display='none';
      document.getElementById('planDurationCustom').value=''; currentFeatures=[];
    }
    renderFeatureRows();
    formPanel.classList.add('open');
    formPanel.scrollIntoView({behavior:'smooth', block:'center'});
  }
  function closeForm(){ formPanel.classList.remove('open'); state.editingPlanIndex = null; }

  document.getElementById('addPlanBtn').addEventListener('click', ()=> openForm(null));
  document.getElementById('cancelPlanBtn').addEventListener('click', closeForm);
  document.getElementById('savePlanBtn').addEventListener('click', ()=>{
    const name = document.getElementById('planName').value.trim();
    const price = document.getElementById('planPrice').value.trim();
    const duration = planDuration.value;
    const customLabel = document.getElementById('planDurationCustom').value.trim();
    let invalid = false;
    [['planName',!!name],['planPrice',!!price],['planDuration',!!duration]].forEach(([id,ok])=>{
      document.getElementById(id).classList.toggle('invalid', !ok); if(!ok) invalid = true;
    });
    if(duration==='Custom' && !customLabel){ document.getElementById('planDurationCustom').classList.add('invalid'); invalid = true; }
    if(invalid) return;
    const durationLabel = duration==='Custom' ? customLabel : DURATION_LABELS[duration];
    const features = currentFeatures.map(f=>f.trim()).filter(Boolean);
    const plan = { name, price, duration, durationLabel, features };
    if(state.editingPlanIndex !== null) state.plans[state.editingPlanIndex] = plan; else state.plans.push(plan);
    closeForm(); renderPlans();
  });

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzs3bDWe5944YihGO_8ZPqlpuOkhBSk8zE3zdYapo0ABHXwqAH8Y14Scqa_ZC3-YTeg/exec";

/**
 * Normalizes any file/blob/base64 object into { base64, name, type } using FileReader
 */
function fileToBase64(file, defaultName, defaultType) {
  return new Promise((resolve, reject) => {
    if (!file) {
      resolve(null);
      return;
    }
    // Already structured object
    if (typeof file === 'object' && file.base64) {
      resolve({
        base64: file.base64,
        name: file.name || defaultName || 'image.png',
        type: file.type || defaultType || 'image/png'
      });
      return;
    }
    // Data URL string
    if (typeof file === 'string' && file.startsWith('data:')) {
      const mime = (file.match(/data:(.*?);/) || [])[1] || defaultType || 'image/png';
      resolve({
        base64: file,
        name: defaultName || ('image.' + (mime.split('/')[1] || 'png')),
        type: mime
      });
      return;
    }
    // Native File or Blob instance
    if (file instanceof Blob || file instanceof File) {
      const reader = new FileReader();
      reader.onload = () => resolve({
        base64: reader.result,
        name: file.name || defaultName || 'upload.png',
        type: file.type || defaultType || 'image/png'
      });
      reader.onerror = err => reject(err);
      reader.readAsDataURL(file);
      return;
    }
    resolve(null);
  });
}

/**
 * Bundles form fields and converts all image inputs concurrently using Promise.all()
 */
async function buildSubmissionPayload() {
  const submissionId = 'FIT-GYM-' + Math.floor(100000 + Math.random() * 900000);
  const submissionDate = new Date().toISOString();

  // Convert Logo & Banner with FileReader
  const logoData = await fileToBase64(state.basicInfo.logo, 'logo.png', 'image/png');
  const bannerData = await fileToBase64(state.basicInfo.banner, 'banner.jpg', 'image/jpeg');

  // Concurrently map all gallery images using Promise.all()
  const galleryData = await Promise.all(
    state.images.map(async (img, idx) => {
      const fileSource = img.file || img;
      const b64Obj = await fileToBase64(fileSource, img.name || `gallery_${idx + 1}.jpg`, img.type || 'image/jpeg');
      return {
        base64: b64Obj ? b64Obj.base64 : (img.src || ""),
        name: img.name || (b64Obj ? b64Obj.name : `gallery_${idx + 1}.jpg`),
        type: img.type || (b64Obj ? b64Obj.type : 'image/jpeg'),
        category: img.category || 'Other',
        isCover: !!img.isCover
      };
    })
  );

  return {
    submissionId,
    submissionDate,

    // Image Uploads
    logo: logoData,
    banner: bannerData,
    gallery: galleryData,

    // Gym Information
    gymName: state.basicInfo.gymName,
    tagline: state.basicInfo.tagline,
    description: state.basicInfo.description,

    // Contact Information
    phone: state.basicInfo.phone,
    email: state.basicInfo.email,
    website: state.basicInfo.website,
    instagram: state.basicInfo.instagram,
    whatsapp: state.basicInfo.whatsapp,
    basicInfo: state.basicInfo,

    // Location
    location: state.location,
    address: state.location.address,
    city: state.location.city,
    state: state.location.state,
    pincode: state.location.pincode,
    country: state.location.country,
    coordinates: `${state.location.lat}, ${state.location.lng}`,

    // Operating Hours & Holidays
    operatingHours: Object.entries(state.hours).map(([day, h]) => ({ day, ...h })),
    hours: state.hours,
    holidays: state.holidays,

    // Services & Amenities
    services: state.services.filter(s => s.selected).map(s => s.name),
    amenities: state.amenities.filter(a => a.selected).map(a => a.name),

    // Membership Plans
    membershipPlans: state.plans,
    plans: state.plans
  };
}

/**
 * Posts JSON payload to Google Apps Script Web App
 */
async function submitToBackend(payload) {
  if (!WEB_APP_URL || WEB_APP_URL === "YOUR_DEPLOYED_APPS_SCRIPT_URL") {
    console.warn("WEB_APP_URL is using placeholder. Submitting locally (mock). Update WEB_APP_URL with your deployed Google Apps Script URL.");
    await new Promise(r => setTimeout(r, 1200));
    return {
      status: "success",
      message: "Submission successful (Mock Mode — please set WEB_APP_URL).",
      submissionId: payload.submissionId
    };
  }

  // Sending text/plain avoids CORS preflight OPTIONS request in browser
  const response = await fetch(WEB_APP_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify(payload)
  });

  if (!response.ok) {
    throw new Error(`Server returned HTTP ${response.status}`);
  }

  const result = await response.json();
  return result;
}

/**
 * Submission workflow:
 * - Intercepts form submission and prevents reload
 * - Disables submit button & updates label to "Uploading assets..."
 * - Maps gallery files concurrently with Promise.all()
 * - Sends structured JSON payload to Google Apps Script
 * - Provides clear alert feedback and proceeds to success screen
 */
async function runSubmissionWorkflow(e) {
  if (e && e.preventDefault) e.preventDefault();

  const modalSubmitBtn = document.getElementById('modalSubmit');
  const submitBtn = document.getElementById('submitBtn');

  if (modalSubmitBtn) {
    modalSubmitBtn.disabled = true;
    modalSubmitBtn.textContent = 'Uploading assets...';
  }
  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.textContent = 'Uploading assets...';
  }

  try {
    // 1. Bundle and convert all assets concurrently with Promise.all()
    const payload = await buildSubmissionPayload();

    // 2. Post to Google Apps Script backend
    const result = await submitToBackend(payload);

    if (result && (result.status === 'success' || result.success)) {
      state.lastSubmissionId = result.submissionId || payload.submissionId;

      // Provide clear feedback alert to user on completion
      alert('Gym profile submitted successfully! Your details and media have been uploaded to Google Drive and Google Sheets.');

      document.getElementById('modalBackdrop').classList.remove('open');
      goto('success');
    } else {
      throw new Error((result && result.message) || 'Server returned an error.');
    }
  } catch (err) {
    console.error('Submission Error:', err);
    alert('Submission failed: ' + (err.message || 'Please check your connection and try again.'));
  } finally {
    if (modalSubmitBtn) {
      modalSubmitBtn.disabled = false;
      modalSubmitBtn.textContent = 'Submit Profile';
    }
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Gym Profile';
    }
  }
}

          <div class="status-row"><div class="status-check">${CHECK_SVG}</div>Review pending</div>
        </div>
        <div class="id-block"><div class="id-label">Submission ID</div><div class="id-value">${state.lastSubmissionId || 'FIT-GYM-000000'}</div></div>
        <div class="next-step"><b>Expected next step</b>Our team will review the submitted information.</div>
        <div class="success-actions">
          <button class="btn btn-primary" id="doneBtn">Done</button>
          <button class="btn btn-ghost" id="anotherBtn">Submit Another Gym</button>
        </div>
      </div>
    </div>`;

  document.getElementById('doneBtn').addEventListener('click', ()=>{
    alert('This would close the onboarding flow and return to the gym owner\'s dashboard or FITAVAL home.');
  });
  document.getElementById('anotherBtn').addEventListener('click', ()=>{
    resetState();
    goto(1);
  });
}

function resetState(){
  state.basicInfo = { logo:null, banner:null, gymName:"", tagline:"", description:"", phone:"", email:"", website:"", instagram:"", whatsapp:"" };
  state.location = { address:"", city:"", state:"", pincode:"", country:"", lat:10.5276, lng:76.2144, confirmed:false };
  state.hours = {
    Monday:{open:true,start:"06:00",end:"22:00"}, Tuesday:{open:true,start:"06:00",end:"22:00"},
    Wednesday:{open:true,start:"06:00",end:"22:00"}, Thursday:{open:true,start:"06:00",end:"22:00"},
    Friday:{open:true,start:"06:00",end:"22:00"}, Saturday:{open:true,start:"07:00",end:"20:00"},
    Sunday:{open:false,start:"07:00",end:"13:00"},
  };
  state.holidays = [];
  state.services.forEach(s => s.selected = false);
  state.services = state.services.filter(s => !s.custom);
  state.amenities.forEach(a => a.selected = false);
  state.amenities = state.amenities.filter(a => !a.custom);
  state.plans = [];
  state.images = [];
  state.lastSubmissionId = null;
}

render();
</script>
</body>
</html>
